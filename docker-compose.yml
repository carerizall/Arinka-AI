version: "3.8"

services:
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api

    restart: always

    ports:
      - "8080:8080"

    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: arinka-super-secret-key

    volumes:
      - evolution_instances:/evolution/instances

volumes:
  evolution_instances: